      - Does not claim workflow entry was satisfied at the initial inspection or derive the executable queue before preparing and checking the roadmap.
      - Checks the roadmap's observable outcomes, dependencies, and exit evidence together with the other two prerequisites before entering.
      - Does not require an extra approval after preparation unless an unresolved material decision or existing project gate actually requires it.

