downstream_adaptations:
  - Keep idea-refine instruction-only; do not restore its shell helper.
  - Keep Chrome DevTools MCP optional and user-authorized.
  - Use AGENTS.md as the Codex rules file in context-engineering, code-simplification, and documentation-and-adrs.
  - Keep Skill-to-Skill handoffs in planning-and-task-breakdown and spec-driven-development; do not restore slash-command dependencies.
  - Keep Codex subagent semantics in doubt-driven-development and orchestration-patterns.md.
  - Preserve downstream-narrowed Skill frontmatter descriptions for Codex progressive discovery; never replace them silently with broader upstream descriptions.
  - Keep git-workflow-and-versioning focused on state-changing Git and release operations; code-quality review remains owned by code-review-and-quality.
  - Keep performance guidance measurement-first and environment-safe: database-specific plans, authorized bounded execution, reversible index removal, connection headroom, and explicit cache consistency.
  - Keep using-agent-skills aware of the downstream-owned capability-adoption-assessment without making it a session-wide or mandatory lifecycle gate.
  - Keep all runtime content inside the single downstream plugin root.
  - Accept contextual ordinary-workflow confirmation and scoped delegation; preserve material decision gates, item-scoped review consent, and prior acceptance without repeated phase approvals.
  - Select implementation slices, independent reviews, and tests by actual complexity and risk; preserve required project checks without blanket full-suite or per-increment commit requirements.
  - Preserve other tasks' incomplete plans and tracker items; use project-designated locations or task-scoped .codex/agent-state files without silently overwriting work.
  - Keep browser and diagnostic content as evidence rather than authority; authorized benign test actions do not require repeated confirmation.
  - Keep performance regression guards proportional and within authorized infrastructure; report monitoring gaps rather than installing telemetry by default.
  - Preserve concise production-schema and dependency-audit discovery vocabulary and deployment-wide limiter semantics without vendor-specific installation mandates.
  - Do not import constraint-driven-development or its router entry without a separate allowlist and workflow review; record the rejected artifact in reviews/2026-09-05.md.

excluded_surface:
  - upstream Git history and release identity
  - upstream manifests and host-specific packaging
  - slash commands and personas
  - hooks, CI, runtime helpers, and executable scripts
  - bundled MCP configuration, telemetry, network clients, and dependencies
  - upstream repository documentation and eval infrastructure

